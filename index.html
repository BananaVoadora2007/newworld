<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mundo Pokémon</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Mundo Pokémon</h1>
    <nav>
      <ul>
        <li><a href="#inicio">Início</a></li>
        <li><a href="#galeria">Galeria</a></li>
        <li><a href="#sobre">Sobre</a></li>
      </ul>
    </nav>
  </header>

  <main id="inicio">
    <section class="intro">
      <h2>Bem-vindo ao mundo Pokémon!</h2>
      <p>Explore os monstrinhos mais incríveis da franquia!</p>
      <img src="https://assets.pokemon.com/assets/cms2/img/misc/countries/pt/country_detail_pokemon.png" alt="Logo Pokémon">
    </section>

    <section id="galeria">
      <h2>Galeria Pokémon</h2>
      <div class="galeria-container">
        <img src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/001.png" alt="Bulbasaur">
        <img src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/004.png" alt="Charmander">
        <img src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/007.png" alt="Squirtle">
      </div>
    </section>

    <section id="sobre">
      <h2>Sobre o Site</h2>
      <p>Esse site foi criado para fãs de todas as idades conhecerem e relembrarem seus Pokémon favoritos.</p>
    </section>
  </main>

  <footer>
    <p>Feito com ❤️ por um fã de Pokémon</p>
  </footer>
</body>
</html>
